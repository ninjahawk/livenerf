<line x1="590.0" y1="124" x2="590.0" y2="300" stroke="#e1e0d9" stroke-width="1"/>
<text x="590.0" y="318" text-anchor="middle" fill="#898781" font-size="11">-80</text>
<line x1="656.0" y1="124" x2="656.0" y2="300" stroke="#e1e0d9" stroke-width="1"/>
<text x="656.0" y="318" text-anchor="middle" fill="#898781" font-size="11">-60</text>
<line x1="722.0" y1="124" x2="722.0" y2="300" stroke="#e1e0d9" stroke-width="1"/>
<text x="722.0" y="318" text-anchor="middle" fill="#898781" font-size="11">-40</text>
<line x1="788.0" y1="124" x2="788.0" y2="300" stroke="#e1e0d9" stroke-width="1"/>
<text x="788.0" y="318" text-anchor="middle" fill="#898781" font-size="11">-20</text>
<line x1="854.0" y1="124" x2="854.0" y2="300" stroke="#c3c2b7" stroke-width="1"/>
<text x="854.0" y="318" text-anchor="middle" fill="#898781" font-size="11">0</text>
