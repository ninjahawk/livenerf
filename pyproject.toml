[project]
name = "livenerf"
version = "0.1.0"
description = "Tracking post-launch capability drift in frontier models"
requires-python = ">=3.11"
dependencies = [
    "inspect_ai==0.3.266",
    "pandas>=2.0",
    "statsmodels>=0.14",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.entry-points.inspect_ai]
livenerf = "livenerf._registry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["livenerf"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
